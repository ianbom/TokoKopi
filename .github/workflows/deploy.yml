name: Build, Push to Build Branch, and Deploy

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, bcmath, pdo_mysql, zip
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP Dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare Environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Generate Wayfinder types
        run: php artisan wayfinder:generate --with-form

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build:ssr

      - name: Commit and Push to build branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B build
          git add -f public/build/ resources/js/actions/ resources/js/routes/ resources/js/wayfinder/
          if [ -d bootstrap/ssr ]; then
            git add -f bootstrap/ssr/
          fi
          git commit -m "Auto-build assets from master ($GITHUB_SHA)" || echo "No changes to commit"
          git push origin build --force

      - name: Deploy build branch to hosting
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$RUNNER_TEMP/ssh"
          chmod 700 "$RUNNER_TEMP/ssh"
          ssh-keyscan -p "$DEPLOY_PORT" -t ed25519 "$DEPLOY_HOST" > "$RUNNER_TEMP/ssh/known_hosts" 2>/dev/null
          ACTUAL_HOST_KEY=$(ssh-keygen -lf "$RUNNER_TEMP/ssh/known_hosts" -E sha256 | awk '{print $2}')
          test "$ACTUAL_HOST_KEY" = "$DEPLOY_HOST_KEY"

          sshpass -e ssh -4 -p "$DEPLOY_PORT" \
            -o ConnectTimeout=60 \
            -o ServerAliveInterval=60 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" bash -s -- "$DEPLOY_PATH" <<'REMOTE'
          set -eu
          DEPLOY_PATH="$1"
          cd "$DEPLOY_PATH"
          git fetch origin build --depth 1
          git checkout -B build origin/build
          git reset --hard origin/build
          git clean -fd -e .env -e .env.staging -e storage -e public/storage -e .htaccess
          composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader
          php artisan migrate --force --no-interaction
          php artisan optimize:clear
          php artisan config:cache
          php artisan route:cache
          php artisan view:cache
          echo "Deployment completed successfully"
          REMOTE
